const TITLES=["Rookie","Challenger","Strategist","Veteran","Elite","Legend"],
XPR="How to earn XP: borrow an item +10 · return it in Good condition +15 (+5 otherwise) · join an event +20 · write a review +5 · request a game +5 · win a tournament +50 · season XP resets each season; level and badges are lifetime",
BADGES=[["🎮","First Blood","Borrow your first item",s=>s.n>=1],["🔥","Regular","Borrow 5 times",s=>s.n>=5],["🧭","Explorer","Try 5 different games",s=>s.games>=5],["✨","Clean Player","Return 3 items in Good condition",s=>s.good>=3],
["📅","Event Regular","Join 3 events",s=>s.ev>=3],["📝","Critic","Write 3 reviews",s=>s.rv>=3],["📣","Voice of the Club","Make 2 game requests",s=>s.rq>=2],["🔥","On Fire","4-week activity streak",s=>s.streak>=4],["⚡","Unstoppable","8-week activity streak",s=>s.streak>=8],["🏆","Champion","Win a tournament",s=>s.wins>=1]];
const wk=d=>{const[y,m,dd]=String(d).slice(0,10).split("-").map(Number);return Math.floor((Date.UTC(y,m-1,dd)/864e5+3)/7)};
function streak(roll){const w=new Set([...S.issues,...S.signups,...S.reviews,...S.reqs].filter(x=>x.roll==roll&&/^\d{4}-/.test(x.at)).map(x=>wk(x.at)));let c=wk(now()),n=0;if(!w.has(c))c--;while(w.has(c)){n++;c--}return n}
function stat(roll,from=""){
  const f=x=>!from||String(x.at)>=from,I=S.issues.filter(x=>x.roll==roll&&f(x)),R=I.filter(x=>x.ret),good=R.filter(x=>(x.cond||"Good")=="Good").length,ev=S.signups.filter(g=>g.roll==roll&&f(g)).length,rv=S.reviews.filter(r=>r.roll==roll&&f(r)).length,rq=S.reqs.filter(r=>r.roll==roll&&f(r)).length,wins=S.brackets.filter(b=>champ(b)==roll&&f(b)).length;
  const xp=I.length*10+good*15+(R.length-good)*5+ev*20+rv*5+rq*5+wins*50,lvl=1+Math.floor(Math.sqrt(xp/30));
  return{xp,lvl,lo:30*(lvl-1)**2,hi:30*lvl**2,n:I.length,good,ev,rv,rq,wins,games:new Set(I.map(x=>x.item)).size,streak:from?0:streak(roll)}}

  mine=me?stat(me.roll):null,T=l=>TITLES[Math.min(l-1,5)],my=me&&pyr(me.roll),rank=me?board.findIndex(p=>p.r==me.roll)+1:0,

  <div>🔥 Activity streak: <b>${mine.streak}</b> week${mine.streak==1?"":"s"}</div>

function askCond(id,edit){
  const x=S.issues.find(i=>i.id==id),d=document.createElement("div");d.id="mo";
  d.innerHTML=`<div class="card" style="width:100%;max-width:360px"><h2>${edit?"✎ CONDITION CHECK":"↩ RETURN"}: ${esc(x.item).toUpperCase()}</h2><label>CONDITION</label><select id="cd">${COND.map(c=>`<option${c==x.cond?" selected":""}>${c}</option>`).join("")}</select><label>NOTE (REQUIRED IF NOT GOOD)</label><input id="cn" maxlength="120" value="${esc(x.note||"")}" placeholder="e.g. scratch on controller"><button class="b w" id="ok">✔ CONFIRM</button><button class="b g w" style="font-size:14px;padding:8px;margin-top:8px" id="no">Cancel</button></div>`;
  document.body.appendChild(d);
  $("#no").onclick=()=>d.remove();
  $("#ok").onclick=()=>{const cond=$("#cd").value,note=$("#cn").value.trim();if(cond!="Good"&&!note)return alert("Please add a short note describing the problem.");d.remove();call(edit?"cond":"ret",{id,cond,note})}}
function lb(){
  const mo=now().slice(0,7),L=S.issues.filter(x=>lp=="a"||String(x.at).slice(0,7)==mo);
  const top=(key,label)=>{const m={};L.forEach(x=>{const k=key(x);(m[k]=m[k]||{k,n:0,l:label(x)}).n++});return Object.values(m).sort((a,b)=>b.n-a.n).slice(0,10)};
  const list=(a,c)=>a.length?a.map((r,i)=>`<div class="lr${me&&r.k==me.roll?" me":""}"><span class="rk">${["🥇","🥈","🥉"][i]||i+1}</span><span class="ln">${esc(r.l)}</span><div class="bw"><div class="bf" style="width:${r.n/a[0].n*100}%;background:var(${c})"></div></div><b>${r.n}</b></div>`).join(""):'<div class="em">No activity yet.</div>';
  $("#v").innerHTML=`<div class="bar"><button class="b ${lp=="m"?"":"g"}" onclick="lp='m';lb()">This month</button><button class="b ${lp=="a"?"":"g"}" onclick="lp='a';lb()">All time</button></div>
  <div class="lg"><div><h3>★ TOP PLAYERS</h3>${list(top(x=>x.roll,x=>tn(x.roll,x.name)),"--cy")}</div><div><h3>◆ MOST BORROWED</h3>${list(top(x=>x.item,x=>x.item),"--pk")}</div></div>`}
function issue(id){const i=S.items.find(i=>i.id==id);if(i.repair)return alert("This item is under repair.");
  if(confirm(`Issue '${i.name}' to ${me.name} (${me.roll})?`+(i.ver?`\n\nNote: this item needs a quick verification call from the club to ${me.mobile}. Please keep your phone reachable.`:"")))call("issue",{item:i.name,name:me.name,roll:me.roll,mobile:me.mobile})}
function addItem(){const name=prompt("Name of game/equipment:");if(!name)return;const cat=prompt("Category (Board Game, Card Game, Console, Controller, Equipment):")||"",total=parseInt(prompt("Quantity owned:","1")),
  ver=confirm("Should this item need a verification call when issued?\n\nOK = Yes, Cancel = No");if(total>0)call("add",{name:name.trim(),cat:cat.trim(),total,ver})}
function setQ(id,cur){const total=parseInt(prompt("New total quantity:",cur));if(total>0)call("set",{id,total})}
function csv(){const r=[["Item","Name","Roll No","Mobile","Issued At","Returned At","Verified","Condition","Note"],...S.issues.map(x=>[x.item,x.name,x.roll,"'"+x.mobile,x.at,x.ret,x.vf=="P"?"Pending":x.vf||"",x.cond||"",x.note||""])];
  const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([r.map(l=>l.map(c=>'"'+String(c).replace(/"/g,'""')+'"').join(",")).join("\n")],{type:"text/csv"}));a.download="gambit_issues.csv";a.click()}

if(API_URL)setInterval(()=>{if(document.hidden||!(me||admin)||document.body.classList.contains("busy"))return;
  fetch(API_URL,{method:"POST",body:JSON.stringify({action:"get",pin,roll:me?me.roll:""})}).then(r=>r.json()).then(j=>{const n=fx(j);if(!j.error&&JSON.stringify(n)!==JSON.stringify(S)){S=n;draw()}}).catch(()=>{})},30000);
if(!API_URL)local("get",{});else call("get");
show();
</script></body></html>
